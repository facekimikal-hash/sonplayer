<script>
const $=s=>document.querySelector(s),ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
/* ===== TEMAS GRATIS: paleta libre. (Los temas de pago irán en la tienda más adelante) ===== */
const hx=c=>[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));
const lum=c=>{const[r,g,b]=hx(c);return(.299*r+.587*g+.114*b)/255};
const mix=(a,b,t)=>'#'+hx(a).map((v,i)=>Math.round(v+(hx(b)[i]-v)*t).toString(16).padStart(2,'0')).join('');
const PRE=[['Manga',{bg:'#f1f1f4',card:'#ffffff',ink:'#0c0c12',ac:'#2f5bff',ac2:'#ffd60a'}],['Noche',{bg:'#14141f',card:'#1f1f2e',ink:'#f2f0ff',ac:'#7c6cff',ac2:'#ffd166'}],['B/N',{bg:'#ffffff',card:'#ffffff',ink:'#000000',ac:'#000000',ac2:'#d9d9d9'}]];
const PK=[['bg','Fondo'],['card','Tarjetas'],['ink','Texto y líneas'],['ac','Acento'],['ac2','Acento 2']];
/* ===== TEMAS DE PAGO: para añadir uno, copia el bloque (id, nombre, precio p, colores v, mascota m) ===== */
const TH=[];let CAT=ld('cat',[]);
function mergeTH(){const m={};(S.ot||[]).forEach(t=>m[t.id]=t);CAT.forEach(t=>m[t.id]=Object.assign({},m[t.id],t));TH.length=0;Object.values(m).forEach(t=>TH.push(t))}
const inShop=t=>CAT.some(c=>c.id==t.id)&&(!t.hasta||new Date(t.hasta+'T23:59:59')>=new Date());
function keep(t){try{caches.open('son-temas').then(c=>c.add(t.m)).catch(()=>{})}catch(e){}}
async function loadCat(){try{const r=await fetch('temas.json',{cache:'no-cache'});if(!r.ok)return;const j=await r.json();CAT=j.temas||[];try{localStorage.setItem('cat',JSON.stringify(CAT))}catch(e){}
 (S.ow||[]).forEach(id=>{const c=CAT.find(t=>t.id==id);if(c&&!S.ot.some(t=>t.id==id)){S.ot.push(JSON.parse(JSON.stringify(c)));keep(c)}});sv();mergeTH();theme();shop()}catch(e){}}
const M0=$('#mas').getAttribute('src');
let S=Object.assign({coins:0,sec:0,meta:{},fv:{},pc:{},pl:[],md:0,ow:[],tid:'',ot:[]},ld('sp',{}));S.cfg=Object.assign({},PRE[0][1],{glow:false,gl:'#ff3bd4',mas:false},S.cfg);if(!S.mi){S.cfg.mas=false;S.mi=1}
const sv=()=>{try{localStorage.setItem('sp',JSON.stringify(S))}catch(e){toast('No hay espacio para guardar')}};
function toast(m){const e=$('#toast');e.textContent=m;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}
function theme(){const P=TH.find(x=>x.id==S.tid),c=P?Object.assign({},S.cfg,P.v):S.cfg,d=lum(c.bg)<.45,set=(k,v)=>document.documentElement.style.setProperty('--'+k,v);
 ['bg','card','ink','ac','ac2'].forEach(k=>set(k,c[k]));set('dot',mix(c.bg,c.ink,.13));set('on',lum(c.ac)>.6?'#111':'#fff');set('on2',lum(c.ac2)>.6?'#111':'#fff');set('gl',c.gl);
 set('mb',P?'normal':d?'screen':'multiply');set('mf',P||!d?'none':'invert(1)');$('#mas').src=P?P.m:M0;$('#thcss').textContent=P&&P.css||'';TH.forEach(t=>document.body.classList.toggle('th-'+t.id,S.tid==t.id));set('mas',c.mas&&P?'block':'none');$('#monr').hidden=!P;document.body.classList.toggle('glow',!!c.glow)}
const coins=()=>$('#coins').textContent='🪙 '+S.coins;

const A=new Audio();let L=[],cur=-1,LY=[];

const T=t=>{const m=S.meta[t.key]||{};return{t:m.t||t.t,a:m.a||t.a,c:m.c||t.c,l:m.l}};

/* ===== biblioteca guardada en el teléfono (IndexedDB) + lectura de etiquetas ===== */
